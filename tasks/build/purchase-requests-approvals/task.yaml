id: purchase-requests-approvals
track: build
category: procurement
title: School district purchase requests with amount-based two-step approval, budget lines, and PO numbers
ask: |
  I run the business office for a school district, and I want purchase requests, approvals, and
  department budgets in one place instead of paper forms, with a dashboard. Attached are this year's
  budget lines, our vendor list, and the requests entered so far this school year. Every request is
  charged to one of its own department's budget lines; under $2,500 it needs only the department
  head's approval, $2,500 or more also needs the business office after the department head, and only a
  fully approved request gets the next PO number and counts against its budget line. Staff see only
  their own requests, department heads see and approve their own department's, our auditor can read
  everything without changing anything, and I manage users and settings. Give me an admin login and a
  login for Denise Harlan, our transportation director.
seed:
  - seed/budgets.csv
  - seed/vendors.csv
  - seed/requests.csv
timeout_per_turn_s: 3600

# The harness must leave this file in the workspace root when the build turn ends.
# Testers reach the app only through it.
result_contract:
  path: RESULT.json
  fields:
    url: Login page of the app, reachable from outside the build machine (no localhost or private LAN address).
    admin:
      user: Admin username or email (the business office).
      password: Admin password.
    restricted:
      user: Login for Denise Harlan, the Transportation department head.
      password: That department head's password.
    notes: >
      Free text. Must confirm the restricted login is Denise Harlan (Transportation). May include an
      auditor or requester login, how to restart the app, and anything else a tester needs.
  example: |
    {
      "url": "https://example-app.host/login",
      "admin": {"user": "business.office@example.com", "password": "..."},
      "restricted": {"user": "dharlan@example.com", "password": "..."},
      "notes": "restricted login is Denise Harlan (Department Approver, Transportation). Auditor: auditor@example.com / ... Restart: systemctl restart purchasing."
    }

checklist: checklist.md
reference: reference/counts.json          # grader-only; never mounted for the harness
core_items: [1, 3, 5, 6, 8, 14, 19, 21, 22]
changes:
  - changes/1.md
  - changes/2.md
  - changes/3.md

# Authoring notes only; never shown to the harness.
traps:
  - budgets.csv mixes 12 lines from fiscal year 2025-26 with this year's, plus 4 exact duplicates and 2 rows repeating a line with its code written 0111804300 / 01.1180.4300 (90 rows -> 72 lines; 84 if last year is kept) (items 8, 15)
  - account codes appear as 01-3600-4300, 01.3600.4300, 0136004300, and "01 3600 4300" in both budgets and requests; linking on raw text leaves requests without a budget line and understates what is committed (items 17, 19)
  - department written TRANSPORTATION / Transp. / M&O / Tech / IT / SPED / C&I; a verbatim import breaks the Transportation scope of 30 requests (items 6, 9)
  - vendors.csv has 3 exact duplicates and 3 vendors repeated under the same tax ID without its hyphen and with "Inc" / ", LLC" name variants (90 -> 84); 6 inactive vendors must not be offered on new requests (item 16)
  - requests.csv (BOM + CRLF) writes PO numbers as PO-27-0045, PO27-0045, and PO-27-9; a text maximum picks PO27-0057, so the next number comes out as PO-27-0058 instead of PO-27-0081 (item 22)
  - amounts over 999 are partly "$35,558.00" strings; a text sort puts PR-27-0085 first (item 10)
  - PR-27-0075 (Rejected) has Amount -480.00; must be flagged or corrected, not silently kept, and stays out of every figure (item 18)
  - budget remaining must subtract only Approved requests: counting Submitted or Dept Approved requests, or last year's lines, moves the dashboard figure (items 8, 19)
  - the threshold is inclusive at 2,500.00: 2,499.99 is one step and 2,500.00 is two; a PO number or budget deduction at the department step fails (items 20, 21, 22)
