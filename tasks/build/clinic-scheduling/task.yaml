id: clinic-scheduling
track: build
category: healthcare
title: Physiotherapy clinic scheduling app with double-booking rules, no-show tracking, recall list, and utilization
ask: |
  We're Northshore Physiotherapy, six therapists, and we're moving our appointment book off paper. Our
  patient list, the therapist roster through September, and our appointments are attached; a few
  patients registered twice, and some different patients happen to share a name. Nobody should ever be
  double-booked, therapist or patient, and I want no-shows tracked with anyone who has missed two
  appointments flagged. Patients who aren't discharged, have been in before, and have nothing booked
  should land on a recall list so the front desk can call them. Therapists should only see their own
  schedule, our accountant needs to see everything without changing anything, and I want a dashboard
  with bookings, no-shows, the recall list, and each month's utilization (time in completed
  appointments as a share of rostered hours); send me an admin login and one for Lena Fischer.
seed:
  - seed/patients.csv
  - seed/roster.csv
  - seed/appointments.csv
timeout_per_turn_s: 3600

# The harness must leave this file in the workspace root when the build turn ends.
# Testers reach the app only through it.
result_contract:
  path: RESULT.json
  fields:
    url: Login page of the app, reachable from outside the build machine (no localhost or private LAN address).
    admin:
      user: Admin username or email (the clinic director).
      password: Admin password.
    restricted:
      user: Login for Lena Fischer, therapist.
      password: Lena's password.
    notes: >
      Free text. Must say the restricted login is Lena Fischer. May include other therapist or accountant
      logins, how to restart the app, and anything else a tester needs.
  example: |
    {
      "url": "https://example-app.host/login",
      "admin": {"user": "director@northshorephysio.example", "password": "..."},
      "restricted": {"user": "lena.fischer@northshorephysio.example", "password": "..."},
      "notes": "restricted login is Lena Fischer. Restart: systemctl restart clinic."
    }

checklist: checklist.md
reference: reference/counts.json          # grader-only; never mounted for the harness
core_items: [1, 3, 5, 6, 8, 14, 15, 22]
changes:
  - changes/1.md
  - changes/2.md
  - changes/3.md

# Authoring notes only; never shown to the harness.
traps:
  - 159 patient rows -> 150 patients after 5 exact duplicates and 4 re-registrations under a second record number with the last name in capitals and the birth date in another format (item 15)
  - three pairs of different patients share a name (Donna Morris, Ronald Edwards, Jessica Nelson); matching on name alone gives 147 (item 15)
  - the roster has one row per dated shift (101 rows, 6 therapists) with times written 08:00, 8:00 AM, 8am, or 1:00 PM and therapist names in mixed case (item 16)
  - durations written 45, 45 min, 0:45, 1:00, or 1h; reading 1:00 as one minute or a clock time breaks utilization (items 17, 21)
  - record numbers in appointments with and without leading zeros and under the second registration; unmerged patients split no-shows (Carlos Nelson 1 + 1) and bookings (Jeffrey Nelson back on the recall list, 59) (items 17, 19, 20)
  - Marcus Bell is double-booked on 2026-09-15 in the import and must be flagged, while an overlap with a cancelled appointment is not a conflict (items 18, 22)
  - the recall list excludes discharged patients (82 if included) and counts a cancelled future appointment as nothing booked (item 20)
  - Therapist written LENA FISCHER on some rows; exact matching gives Lena 61 appointments instead of 65 (item 6)
  - a text sort on the Date column puts September 26, 2026 9:00 AM above 09/26/2026 10:45 (item 10)
  - back-to-back bookings (ending 13:45, starting 13:45) must be allowed, and the patient double-booking rule must span therapists (items 22, 23)
  - no-show flag and recall list must update when statuses and bookings change, not only at import (items 24, 25)
