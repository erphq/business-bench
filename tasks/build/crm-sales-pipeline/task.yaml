id: crm-sales-pipeline
track: build
category: sales
title: B2B sales CRM with accounts, contacts, a staged deal pipeline, weighted forecast, and activity log
ask: |
  We're a nine-person consulting firm and I want one place for our client accounts, their contacts,
  and our deals, with the calls, emails, and meetings reps log on a deal showing on that deal and on
  the client's account. Our accounts, contacts, and pipeline are attached; they were kept in three
  separate spreadsheets, so there are duplicates, and I want each account and each person in there
  only once. Deals go Lead, Qualified, Proposal, Negotiation, then Won or Lost: nothing goes to
  Proposal without an amount and a contact, nobody marks a deal Lost without a reason, and the
  dashboard should show our pipeline weighted at 10, 25, 50, and 75 percent for those four open
  stages. Each rep sees only their own accounts and deals, our analysts can read everything but
  change nothing, and I look after the users and settings. Give me an admin login and a login for
  Leila Haddad, one of our reps.
seed:
  - seed/accounts.csv
  - seed/contacts.csv
  - seed/deals.csv
timeout_per_turn_s: 3600

# The harness must leave this file in the workspace root when the build turn ends.
# Testers reach the app only through it.
result_contract:
  path: RESULT.json
  fields:
    url: Login page of the app, reachable from outside the build machine (no localhost or private LAN address).
    admin:
      user: Admin username or email.
      password: Admin password.
    restricted:
      user: Login for the rep Leila Haddad.
      password: That rep's password.
    notes: >
      Free text. Must confirm the restricted login is Leila Haddad. May include an analyst login,
      how to restart the app, and anything else a tester needs.
  example: |
    {
      "url": "https://example-app.host/login",
      "admin": {"user": "admin@example.com", "password": "..."},
      "restricted": {"user": "leila@example.com", "password": "..."},
      "notes": "restricted login is Leila Haddad (Rep). Analyst login: analyst@example.com / ... Restart: systemctl restart crm."
    }

checklist: checklist.md
reference: reference/counts.json          # grader-only; never mounted for the harness
core_items: [1, 3, 5, 6, 8, 14, 15, 22, 25]
changes:
  - changes/1.md
  - changes/2.md
  - changes/3.md

# Authoring notes only; never shown to the harness.
traps:
  - accounts.csv has 5 exact duplicate rows and 3 rows repeating an account in capitals with its website written WWW./http:// differently (80 rows -> 72); collapsing the 4 blank-website accounts into one gives 69 (items 15, 16)
  - contacts.csv (BOM + CRLF) has 2 exact duplicates and 6 rows repeating an email in other capitals (150 -> 142); 5 blank-email contacts must stay apart (138 if merged) and Nancy Clark is two different people at two accounts (141 on a name dedupe) (item 17)
  - 4 contact rows write the account name with a trailing space and others in capitals, so an exact-text link leaves contacts orphaned (item 18)
  - deals.csv opens with a two-line report preamble before the header; a reader that takes line 1 as the header imports nothing usable (items 10, 11, 19)
  - stages are written in mixed case and as "Closed Won" / "Closed Lost"; importing them verbatim creates extra stages and breaks the Proposal filter (17) and the per-stage counts (items 10, 19)
  - 21 amounts are "$185,000.00"-style strings and 4 Lead deals have no amount; a text sort puts Mosaic Staffing first and a failed parse zeroes the weighted pipeline (items 8, 10)
  - Expected Close in six date formats; a text sort puts a "September 08, 2026" deal ahead of the real latest, Jun 30 2027 (item 20)
  - Parkstone Engineering - Cost reduction program has Amount -4,500.00; must be flagged or corrected, not silently kept, and still exist (item 21)
  - about 12% of deal rows write the owner in lower case ("leila haddad"); a case-sensitive scope match undercounts Leila's 30 deals and 23 open deals (items 6, 9)
  - deals.csv links contacts by email, some in capitals; unlinked contacts leave Proposal-stage deals invalid under the Proposal rule, which then blocks the stage move in item 22 (items 22, 23)
  - weighted pipeline must be derived from the current stage, not stored per deal at import; a stored figure does not move when the deal changes stage (item 22)
