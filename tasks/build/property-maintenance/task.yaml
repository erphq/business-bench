id: property-maintenance
track: build
category: property-management
title: Maintenance app for six apartment buildings with work requests, work orders, vendors, approvals, and a dashboard
ask: |
  We manage six apartment buildings, and I need one place to run maintenance: tenants' work requests
  come in, we turn the ones we accept into work orders, and each work order goes to a vendor who does
  that kind of work and whose insurance is current. Any work order estimated over $1,500 has to wait for
  my approval before the vendor is sent. Our units, tenants, vendors, and last year's requests are
  attached; they came out of different systems and repeat themselves in places, so make sure nothing is
  counted twice. I want team logins with different access: each building manager sees and handles only
  their own buildings, and our accountant can see everything but change nothing. Give me a dashboard
  that starts with how many requests are open, an admin login for me, and a login for Rosa Delgado, who
  manages Harbor View and Elm Court.
seed:
  - seed/units.csv
  - seed/tenants.csv
  - seed/vendors.csv
  - seed/work_requests.csv
timeout_per_turn_s: 3600

# The harness must leave this file in the workspace root when the build turn ends.
# Testers reach the app only through it.
result_contract:
  path: RESULT.json
  fields:
    url: Login page of the app, reachable from outside the build machine (no localhost or private LAN address).
    admin:
      user: Admin username or email.
      password: Admin password.
    restricted:
      user: Login for Rosa Delgado, building manager for Harbor View and Elm Court.
      password: Rosa's password.
    notes: >
      Free text. Must say the restricted login is Rosa Delgado. May include how to invite users, a vendor
      login, how to restart the app, and anything else a tester needs.
  example: |
    {
      "url": "https://example-app.host/login",
      "admin": {"user": "owner@example.com", "password": "..."},
      "restricted": {"user": "rosa@example.com", "password": "..."},
      "notes": "restricted login is Rosa Delgado (Harbor View, Elm Court). Restart: systemctl restart maintenance."
    }

checklist: checklist.md
reference: reference/counts.json          # grader-only; never mounted for the harness
core_items: [1, 3, 5, 6, 8, 14, 15, 21, 24]  # "first usable" = these pass
changes:
  - changes/1.md
  - changes/2.md
  - changes/3.md

# Authoring notes only; never shown to the harness.
traps:
  - units.csv spells the six buildings 13 ways ("Cedar Ter.", "CEDAR TERRACE", "Harbor View Apts", "Riverside Cmns", ...) and repeats 8 rows, 3 of them under another spelling (186 rows -> 178 units in 6 buildings) (items 15, 10)
  - tenants.csv has 3 exact repeats and 4 re-entries with the email in different capitals (173 rows -> 166); two different tenants are both named Amy Ortiz and must not merge (item 16)
  - unit numbers are written "#103", "Apt L204", "Unit 207" in tenants and requests and must link to the plain unit (item 17)
  - Luis Carter's lease ends 4/30/2026, the day before it starts (01-May-2026); flag it, don't import it silently (item 18)
  - rents and balances mix "$3,100.00", "2275", and "($45.00)"; a text sort ranks the wrong tenant first and a parenthesised credit read as owed turns the change-2 chargeback into 225.00 (item 19, change item 31)
  - work_requests.csv re-exports WR-00412 as "412" and WR-00318 as "WR-318" and repeats two open requests (154 rows -> 150; open 26, not 28) (items 11, 20, change item 27)
  - statuses are worded complete / Closed / Canceled and new / In progress / Waiting - vendor; treating only the exact words Completed and Cancelled as closed gives 80 open requests instead of 26 (items 8, 20)
  - estimated costs mix "$6,850.00", "965", and "995.00"; a text sort puts WR-00410 first instead of WR-00447 (item 10)
  - vendors.csv types two vendors twice ("Apex Plumbing LLC", "KEYWAY LOCKSMITHS") and gives insurance expiry in four date formats; 8 vendors are already expired, Summit Pest Solutions among them, and a text comparison of "3/31/2026" against today misjudges it (items 22, 23)
  - the approval rule is "over $1,500": 1,500.00 exactly must not be held, and the building manager must not be able to approve her own 2,400.00 work order (item 24)
