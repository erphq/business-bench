id: leave-tracking
track: build
category: hr
title: Leave tracking with team approvals, working-day balances, holidays, and overlap warnings
ask: |
  We're a 40-person company and I want leave requests out of email and into one place, with a
  dashboard. Attached are our staff list with departments, managers, and each person's remaining
  annual leave, the requests already booked this year, and our holiday calendar; the staff list still
  includes people who have left. Staff ask for time off, their manager approves it, and approved annual
  leave comes off the person's balance counting working days only, so weekends and our holidays don't
  count. When someone asks for days a teammate is already off, warn whoever is approving. Managers see
  and approve only their own team's requests, payroll needs to see everything without changing
  anything, and I handle users and settings; give me an admin login and a login for Grace Oduya, who
  manages Customer Support.
seed:
  - seed/staff.csv
  - seed/leave_requests.csv
  - seed/holidays.csv
timeout_per_turn_s: 3600

# The harness must leave this file in the workspace root when the build turn ends.
# Testers reach the app only through it.
result_contract:
  path: RESULT.json
  fields:
    url: Login page of the app, reachable from outside the build machine (no localhost or private LAN address).
    admin:
      user: Admin username or email.
      password: Admin password.
    restricted:
      user: Login for Grace Oduya, the Customer Support manager.
      password: That manager's password.
    notes: >
      Free text. Must confirm the restricted login is Grace Oduya. May include a payroll login, an
      employee login, how to restart the app, and anything else a tester needs.
  example: |
    {
      "url": "https://example-app.host/login",
      "admin": {"user": "admin@example.com", "password": "..."},
      "restricted": {"user": "grace@example.com", "password": "..."},
      "notes": "restricted login is Grace Oduya (Manager, Customer Support). Payroll: payroll@example.com / ... Restart: systemctl restart leave."
    }

checklist: checklist.md
reference: reference/counts.json          # grader-only; never mounted for the harness
core_items: [1, 3, 5, 6, 8, 14, 15, 22, 23]
changes:
  - changes/1.md
  - changes/2.md
  - changes/3.md

# Authoring notes only; never shown to the harness.
traps:
  - staff.csv holds 16 former staff with a past End Date, 2 exact duplicates, and 2 email-case duplicates (60 rows -> 40 active); ignoring End Date gives 56 (item 15)
  - Owen Pratt's End Date is 2026-10-30, still ahead, so he is active; Daniel Kim was re-hired as E0064 with the same email as his 2024 leaver record E0060, so an email dedupe that keeps the first row makes him inactive (39) (item 15)
  - departments written Eng / Cust. Support / Support / Ops / People and Admin / SALES and with trailing spaces; a verbatim import makes more than six departments (item 16)
  - balances written "3 days" and "27.5 days"; a text parse fails or sorts wrong, and running imported approved requests through the balance automation double-deducts (Mateo Mensah 15.5 would go negative) (items 8, 17)
  - leave_requests.csv (CRLF) has 3 exact duplicate rows (153 -> 150) and Employee ID written E0055 / 55 / E55; linking on raw text orphans about half the requests (items 6, 18)
  - 24 annual requests are typed "Vacation" and statuses come as approved / APPROVED / Canceled; a verbatim import adds types and statuses and breaks the Pending filter (10) (items 10, 19)
  - LR-2026-0131 ends 2026-10-21 before it starts 2026-10-23; must be flagged or corrected, not silently kept (item 20)
  - holidays.csv lists Independence Day 2026 as July 4 (a Saturday) with Observed 07/03/2026; using the Date column instead of Observed counts LR-2026-0083 as 6 days instead of 5 (items 8, 21)
  - day counts must skip weekends and holidays: 2026-11-23 to 2026-11-27 is 3 days, and 2026-12-21 to 2026-12-31 is 6 (items 21, 23)
  - the overlap warning is per team and must not block saving; a department-wide or company-wide check warns the Finance control request (item 24)
