      | Buckeye Power & Light | Electricity | 6150 Utilities | PROD | $5,000.00 |
      | Gem City Telecom | Telephone and internet | 6150 Utilities | ADMIN | $900.00 |
      | CleanPro Janitorial | Office and plant cleaning | 6200 Maintenance and repairs | MAINT | $600.00 |
      | Miami Valley Waste | Waste hauling | 6200 Maintenance and repairs | PROD | $1,200.00 |
      | Precision Calibration Labs | Gauge and instrument calibration | 6250 Shop supplies | QA | $1,500.00 |
      | Dayton Uniform Service | Uniform rental and laundry | 6250 Shop supplies | PROD | $500.00 |
      | Hartman & Cole LLP | Legal services | 6500 Professional fees | ADMIN | $5,000.00 |
      | Brightpath IT Services | Managed IT and software licences | 6350 Software and subscriptions | ADMIN | $2,500.00 |
  VEN-1.2:
    text: |-
      A listed vendor's invoice above its limit needs the written approval of the head of the department it is
      coded to (AP-5.2): ADMIN Erin Walsh, PROD Dana Whitfield, MAINT Kofi Mensah, QA Alex Ng.
  VEN-1.3:
    text: 'Every other vendor is paid against a purchase order (AP-5.3).'
