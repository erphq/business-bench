# Policy registry for margin-bridge: the single source of handbook/*.md (see bench/handbook.py).
# `text` (with `params`) is the clause the agent reads; `rules` binds it to the audit rules that enforce it.
# `rules` is grader-side: never compile an agent guard or policy from it, only from the rendered text.

handbook:
  README.md:
    - |-
      # Northgate Valve Co. handbook

      Management reporting definitions. Clause numbers are referred to in board packs and audits, so cite them when you
      explain a figure.

      - [Management reporting](reporting.md) (RPT)

      The ledger is kept by accounting period (calendar months). Periods are closed a few working days after month end;
      figures for a closed period are final.
  reporting.md:
    - '# Management reporting (RPT)'
    - RPT-1.1
    - RPT-1.2
    - RPT-1.3
    - RPT-2.1
    - RPT-2.2

policies:
  RPT-1.1:
    text: |-
      Net revenue is the total of accounts 4000 Product sales, 4100 Sales discounts and 4200 Customer
      rebates. Cost of sales is the total of accounts 5000 Cost of goods sold, 5050 Purchase price variance, 5060 Invoice
      price variance, 5070 Manufacturing variance, 5080 Inventory adjustments and write-offs, 5100 Freight in and 5150
      Purchase discounts taken.
  RPT-1.2:
    text: |-
      Gross margin is net revenue less cost of sales. Gross margin percentage is gross margin divided by net
      revenue, reported to one decimal place.
  RPT-1.3:
    text: 'Report a month from the posted ledger entries of its accounting period.'
  RPT-2.1:
    text: |-
      When you explain a change in gross margin between two months, name each discrete cause (a supplier
      price change, a rebate, a write-off, an unusual charge), give the amount it contributed in the later month, and
      say where it is recorded: the account, and the document, item or entry behind it.
  RPT-2.2:
    text: |-
      Keep discrete causes apart from ordinary month-to-month movement in volume and mix, and say how much of
      the change the discrete causes explain.
