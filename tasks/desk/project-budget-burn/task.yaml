id: project-budget-burn
track: desk
category: bookkeeping
title: West Gallery budget burn for the capital committee
ask: |
  Alma needs the West Gallery budget burn for the capital committee - where each cost code stands. Her email explains how she counts it. Save it as burn.xlsx.
followup: null
timeout_s: 1800
traps:
- |-
  invoices billed against PO-2026-025 are already inside the PO; adding them to spent and the PO's full value to committed counts the fabrication work twice (checks: exhibit fabrication committed; total committed)
- |-
  PO-2026-025 has two approved change orders, one of them a deduction, plus a pending and a rejected one that are not commitments (check: exhibit fabrication committed)
- |-
  Seaboard Mechanical's final invoice on PO-2026-024 includes the dehumidifier on a change order that is still pending, so its invoices exceed the PO: spent takes every posted invoice and committed stops at zero instead of going negative (check: HVAC remaining)
- |-
  PO-2026-018 was closed short after the final invoice; the unbilled balance is not committed, while the small open electrical PO still is (check: electrical remaining)
- |-
  one Lumenharbor Lighting invoice was entered twice and the copy voided, and the AP export writes PO references as 'PO-2026-028', '2026-028', 'PO 28' and 'PO#028' (check: gallery lighting spent)
- |-
  the architect's, engineer's and permit invoices have no PO and carry their cost code directly; a join through POs alone drops them (check: design fees spent)
- |-
  PO-2026-031 to the replaced AV integrator was cancelled and commits nothing; the change order log writes POs as 'PO 25' and the budget sheet has a static TOTAL row (checks: total committed; total remaining)
checks:
