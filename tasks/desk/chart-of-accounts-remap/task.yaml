id: chart-of-accounts-remap
track: desk
category: reformatting
title: Restate this year's GL lines on the new chart of accounts
ask: |
  Marcus needs our January to August transactions moved onto the new chart of accounts for the new books. His email and the crosswalk are in the folder; please send it back as remapped.csv.
followup: null
timeout_s: 1200
traps:
- |-
  the Account column is QuickBooks' Parent:Child path ('6300 · Vehicle Expense:6310 · Fuel'); taking the first code maps every sub-account line by its parent, which for 6100 and 6500 is not on the crosswalk at all (check: new account code and name)
- |-
  many-to-one: Telephone, Internet and Cell Phones all become 6600 Telecommunications; Fuel, Vehicle Repairs, Vehicle Insurance and the 6300 parent all become 6400 (check: new account code and name)
- |-
  old 6180 Tools & Equipment has no single target; the email capitalizes lines of $2,500.00 or more to 1520 and sends the rest to 6150, with lines at exactly 2,500.00 (1520) and 2,499.99 (6150) (check: new account code and name)
- |-
  coa_crosswalk.xlsx opens on the 'v1 draft' tab, which maps Cell Phones to 6610, Workers Comp to 6710, Licenses to 6810 and all of 6180 to 6150; the email says to use v2 final (check: new account code and name)
- |-
  6725 Charitable Contributions and 6999 Ask My Accountant are on no crosswalk; the lines stay with New Account blank and NEEDS MAPPING in Mapping Note, not dropped and not guessed (checks: new account code and name; unmapped lines flagged; one row per GL line)
- |-
  amounts are text with thousands separators ('4,240.74') and credits in parentheses ('(212.40)') on a customer credit memo and two vendor credits; they stay negative as plain numbers (check: amount)
