  the export carries general fund and regatta entry gifts, among them a gift from Michelle Smith that would be the second-largest (checks: total raised and progress; page structure: top donors)
- |-
  Kwame Collins gave online and by check ('Collins, Kwame' in the log); only the two together make the top five in the right place (check: page structure: top donors)
- |-
  Priya Robinson ticked Hide my name online and also gave a check under their name; the combined total ranks in the top five as Anonymous and the name appears nowhere (checks: anonymous donors kept off; page structure: top donors)
- |-
  percent of goal, amount still to raise and the donor count (people, not gifts) all follow from the treasurer's goal and rules (checks: total raised and progress; page structure: progress figures)
