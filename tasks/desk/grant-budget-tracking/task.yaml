id: grant-budget-tracking
track: desk
category: bookkeeping
title: Grant budget tracking for the board packet
ask: |
  The board packet needs where we stand on each grant budget through August. Nia's cheat sheet on the award terms is in the folder with the budgets and the expense export. Save it as grant_tracking.xlsx.
followup: null
timeout_s: 1200
traps:
- |-
  the program coordinator's wages are split 'SCWF-PER 60% / CPCG-STI 40%' every month from March and the JE-2347 bus is split 70/30; each grant carries only its percentage (the first listed rounded to the cent, the last taking the remainder), so charging the whole amount to the first code listed moves both lines (checks: restoration personnel remaining; coordinator stipend remaining)
- |-
  JE-2318 (volunteer pizza) is tagged to SCWF restoration materials and the state fund pays for no food; JE-2356 is a volunteer lunch split 50/50 where the SCWF half is disallowed and the CPCG half is fine (checks: restoration materials remaining; volunteer recognition remaining)
- |-
  JE-2272 was posted in January but invoiced in December 2025, before the SCWF award period (check: restoration materials remaining)
- |-
  JE-2400 (gift cards) and JE-2403 (wine) are tagged to CPCG volunteer recognition and are never allowable (check: volunteer recognition remaining)
- |-
  JE-2324 and a second staff mileage entry are booked to the HFF education staff line; the foundation pays no mileage (check: total disallowed)
- |-
  JE-2367 is a LaMotte credit memo in parentheses that reduces monitoring equipment spending (check: monitoring equipment remaining)
- |-
  three general-operations expenses (GEN-OPS) sit in the same export and are neither grant spending nor disallowed costs; amounts are text with thousands separators under a two-line preamble with CRLF endings (checks: total disallowed; restoration personnel remaining)
checks:
