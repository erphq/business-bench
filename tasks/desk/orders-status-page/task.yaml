id: orders-status-page
track: desk
category: tooling
title: This week's orders page for the packing bench
ask: |
  Hana wants this week's orders as a page for the packing-bench laptop - her note has what goes on it. Please save it as index.html.
followup: null
timeout_s: 1200
traps:
- |-
  the export carries nine platform codes that map to six statuses (two codes each for To pack, Shipped and Cancelled); counting the raw codes splits those columns (checks: page structure: status counts; page structure: status per order)
- |-
  four orders are CANCELLED or VOIDED; they stay in the table and the counts but not in revenue, and GR-4666 has several lines (checks: revenue this week; page structure: revenue line)
- |-
  the export is one row per line item, so a row-per-line table repeats orders and inflates every count (checks: page structure: one row per order; page structure: status counts)
- |-
  shipping is repeated on every line of a multi-line order; adding it per line overstates order totals and revenue (checks: page structure: order totals; revenue this week)
- |-
  two orders tagged test (one of them CANCELLED, one PAID_UNFULFILLED) are the owner trying the checkout and come off the page (checks: test orders left off; page structure: one row per order)
- |-
  last week's export sits beside this week's with other order numbers (checks: page structure: one row per order; revenue this week)
checks:
- type: file_exists
  name: index.html exists
  path: index.html
- type: text_contains_all
  name: every order listed
  path: index.html
