id: team-directory-page
track: desk
category: tooling
title: Staff directory page for the backstage screen
ask: |
  Please build the new staff directory page from this morning's HR export. Sam's note says what goes on it. Save it as index.html.
followup: null
timeout_s: 1200
traps:
- |-
  four people are Terminated with a last day before today; they are off the page entirely (checks: former staff left off; page structure: one row per person)
- |-
  Tomasz Lindqvist is also marked Terminated but the effective date is 2026-09-21, after today: notice given, still on staff (checks: every current staff member named; page structure: one row per person)
- |-
  Preferred name holds a first name for some people (the page shows it with the legal last name), a whole name for others, and nothing for most; Yuki Bennett-Underwood uses a married name only the Preferred field carries, and seven people's legal first names must not be printed (check: page structure: name people go by)
- |-
  departments are codes, and SCN (Scene Shop) was folded into Production in July, so Maya Yilmaz, Tomasz Lindqvist, Luis Oyelaran belong under Production (check: page structure: department per person)
- |-
  two people hold a secondary job in another department and appear on two export rows; each is listed once, under the primary job (checks: page structure: one row per person; page structure: department per person)
- |-
  two people are on Leave of absence and stay listed (check: every current staff member named)
