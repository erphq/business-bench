id: shipping-rate-lookup
track: desk
category: spreadsheet
title: Work out what the carrier should charge per order
ask: |
  Before Cascade's invoice arrives I want to know what each of today's orders should cost to ship. Use their rate card and the emails in the folder, and save it as orders_shipping.csv.
followup: null
timeout_s: 1200
traps:
- |-
  zones go by the first three ZIP digits, but three East Coast ZIPs lost their leading zero in the export (05401 is written 5401, so its first three digits read as 540, a different zone) and six carry a ZIP+4 suffix (check: zone)
- |-
  billable weight is actual weight rounded up to the next whole pound: 6.0 stays 6 while 6.1 bills as 7, so rounding to nearest or adding one to every weight is wrong, and four small parcels are weighed in ounces (check: billable weight)
- |-
  the large package rule in the Terms sheet: longest side over 48 in bills at least 30 lb plus $28.00; the long side is printed second or third on some labels, one large parcel already weighs over 30 lb and bills at its own weight, and a 48 in box is not over the limit (checks: billable weight; shipping cost)
- |-
  the $4.95 residential surcharge is only in the carrier's email: any label without a business name, and three orders carry 'N/A', '-' or 'none' in the Company column, which is not a business name (check: shipping cost)
- |-
  the rate workbook opens on last year's Ground 2025 table, about 6% cheaper than the 2026 table on the next sheet (check: shipping cost)
checks:
- type: csv_columns
  name: requested columns
  path: orders_shipping.csv
  columns:
  - order_id
  - zone
  - billable_weight
  - shipping_cost
- type: csv_set_equal
  name: every order priced
  path: orders_shipping.csv
  column: order_id
  ref: orders_shipping.csv
  normalize:
  - strip
  - lower
- type: csv_row_count
  name: row count
  path: orders_shipping.csv
  equals_ref: orders_shipping.csv
- type: csv_values_match
  name: zone
  path: orders_shipping.csv
  ref: orders_shipping.csv
  key: order_id
  columns:
  - zone
  numeric: true
  tolerance: 0
  min_accuracy: 1.0
  must_match_keys:
  - UC-5330
  - UC-5361
  - UC-5442
  - UC-5354
  - UC-5364
- type: csv_values_match
  name: billable weight
  path: orders_shipping.csv
  ref: orders_shipping.csv
  key: order_id
  columns:
  - billable_weight
  numeric: true
  tolerance: 0
  min_accuracy: 1.0
  must_match_keys:
  - UC-5385
  - UC-5390
  - UC-5419
  - UC-5491
  - UC-5310
  - UC-5351
  - UC-5359
  - UC-5412
  - UC-5463
  - UC-5333
  - UC-5357
  - UC-5441
- type: csv_values_match
  name: shipping cost
  path: orders_shipping.csv
  ref: orders_shipping.csv
  key: order_id
  columns:
  - shipping_cost
  numeric: true
  tolerance: 0.011
  min_accuracy: 1.0
  must_match_keys:
  - UC-5326
  - UC-5453
  - UC-5461
  - UC-5333
  - UC-5357
  - UC-5441
  - UC-5487
  - UC-5330
  - UC-5361
  - UC-5442
