name: Verify benchmark release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python bench/export_campaign.py --verify
      - run: python bench/release_manifest.py
      - run: python -m compileall -q bench tasks
      - run: python bench/validate_build.py
