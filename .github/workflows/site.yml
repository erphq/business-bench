name: Site
on:
  push:
    branches: [main]
    paths: ["site/**", "tasks/**", "results/latest/**", "SPEC.md", "README.md", "docs/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "tasks/**", "results/latest/**", "SPEC.md", "README.md", "docs/**", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: task export is fresh
        run: python3 scripts/export_tasks.py --check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run build
        env:
          SITE_URL: https://businessbench.org
      - name: deploy
        # Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, Zone: Read, Workers Routes: Edit
        # for businessbench.org) and CLOUDFLARE_ACCOUNT_ID. Until they exist, deploys are run locally.
        if: github.event_name != 'pull_request' && github.repository == 'erphq/business-bench' && env.CLOUDFLARE_API_TOKEN != ''
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
