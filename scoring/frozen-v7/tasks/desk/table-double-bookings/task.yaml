id: table-double-bookings
track: desk
category: spreadsheet
title: Find double-booked tables in the reservations
ask: |
  Marisol wants every double-booked table in the next two weeks of reservations found before service. Go through the booking export and save conflicts.csv - her note explains how bookings work.
followup: null
timeout_s: 1200
traps:
- |-
  a booking holds its table for its duration, so clashes are overlapping windows, not equal times; several sittings are back-to-back (one ends at 7:30, the next starts at 7:30) and are not clashes (check: clashing bookings)
- |-
  four in ten bookings have a blank Duration and take the turn time for the party size; two clashes on the six-tops exist only at the two-hour turn time, while two-top and four-top sittings that follow a blank booking clash only if every blank is read as two hours (checks: clashing bookings; clashes with)
- |-
  a host moved a party to T9 in the Notes while the Table column still says T4, creating a real clash on T9; another party exported on T2 was moved to T11, so the apparent T2 clash is not one (checks: clashing bookings; table)
- |-
  one note names T12 as the table a guest asked for and did not get; reading any table number in Notes as a move invents a clash on T12 (check: clashing bookings)
- |-
  the online widget took overlapping bookings on Monday 21 September and on the private-event Thursday; the note leaves closed days out (check: clashing bookings)
- 'three cancelled bookings sit on top of confirmed ones (check: clashing bookings)'
- |-
  dates are 'Tue 09/15/2026', times are 12-hour, and the export carries a BOM and CRLF endings (check: clashes with)
checks:
- type: csv_columns
  name: requested columns
  path: conflicts.csv
  columns:
  - reservation
  - date
  - table
  - conflicts_with
  # Marisol's note describes the columns in prose ("reservation number, date, table, and the reservation number it
  # clashes with") and never fixes their headers, so match headers by what they hold: the booking's own reservation
  # number (Res #, reservation number, booking id), the date, the table, and the partner booking (clashes with,
  # conflicts with, conflicting / other reservation).
  column_match:
    reservation:
    - ^(?!.*(clash|conflict|overlap|\bwith\b|\bother\b|partner|against|paired|\bvs\b|date|time|table|party|guest|name|status|note))
    - \b(res|resv|rsvn|reservations?|bookings?)\b
    conflicts_with:
    - clash|conflict|overlap|\bwith\b|\bother\b|partner|against|paired|\bvs\b
    - ^(?!.*\b(date|time|table|party|guest|status|notes?|mins?|minutes?|duration|hours?|length|count|size|type|reason|details?)\b)
    date:
    - \bdate\b
    - ^(?!.*(clash|conflict|overlap|\bwith\b|\bother\b|partner))
    table:
    - \btable\b
    - ^(?!.*(clash|conflict|overlap|\bwith\b|\bother\b|partner))
