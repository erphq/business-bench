id: occupancy-report
track: desk
category: reports
title: Q1 occupancy per cabin per month
ask: |
  I need Q1 occupancy for each of our cabins for the owners' letters - one row per cabin, January to March across. Save it as occupancy.xlsx with live formulas. Ruth's note says how the owner agreements count it.
followup: null
timeout_s: 1200
traps:
- |-
  stays cross month ends - a New Year stay checks in during December and one late-March stay checks out in April - and the export's Nights column is the whole stay; putting all of a stay's nights in its check-in month moves Aspen Hollow's January and its quarter (checks: Aspen Hollow Q1 booked nights; occupancy rates)
- |-
  blocked dates are an iCalendar file whose all-day DTEND is the morning after the last blocked night; reading DTEND as a blocked night takes one extra night off every block, and Fox Den's owner hold runs from late January into February (checks: Fox Den Cabin Q1 available nights; occupancy rates)
- |-
  one maintenance block in the calendar is STATUS:CANCELLED and guests stayed on those dates (check: occupancy rates)
- |-
  cancelled reservations stay in the export, some carrying a cancellation-fee payout, and some overlap the stay that rebooked the dates; Bear Creek has three (checks: Bear Creek Lodge Q1 booked nights; total Q1 booked nights)
- |-
  owner stays are $0 'Owner' reservations with status Confirmed; Ruth's note makes those nights blocked rather than occupied (checks: Bear Creek Lodge Q1 booked nights; total Q1 booked nights)
- |-
  the listing names carry marketing suffixes ('Cedar Loft | studio near lifts'), check-in and check-out come in three date formats, and the export has a BOM and CRLF endings (check: total Q1 booked nights)
checks:
- type: file_exists
  name: occupancy.xlsx exists
  path: occupancy.xlsx
- type: xlsx_has_formulas
  name: live formulas
  path: occupancy.xlsx
  min_count: 12
- type: xlsx_no_errors
  name: no error cells
  path: occupancy.xlsx
# The ask and Ruth's note want each cabin's occupancy rate for January, February and March, one row per cabin. The
# former pins on Q1 booked nights (Aspen Hollow 49, Bear Creek Lodge 49, all cabins 247), Fox Den's Q1 available
# nights (80) and the portfolio quarter rate (0.5867) were figures nobody asked for. Their traps are now pinned on
# requested per-cabin monthly rates in the custom check (reference/notes.json rate_pins): Aspen Hollow Mar (stays
# split at month ends), Bear Creek Lodge Feb (cancellations and the owner stay), Fox Den Cabin Jan (blocks, the
# Jan/Feb owner hold split by month), Cedar Loft Feb (the STATUS:CANCELLED block) and Summit A-Frame Jan, so every
# cabin the old portfolio total covered still has a requested figure pinned.
- type: custom
  name: occupancy rates per cabin per month (Fox Den Jan and Feb, Aspen Hollow Jan and Mar, Bear Creek Feb, Cedar Loft Feb, Summit A-Frame Jan)
  module: check.py
