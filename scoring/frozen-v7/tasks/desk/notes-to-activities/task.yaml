id: notes-to-activities
track: desk
category: reformatting
title: Split the tracker notes into Pipedrive activities
ask: |
  We're moving sales onto Pipedrive. Can you turn the notes in our accounts tracker into their activity import and save it as activities.csv? Jason's notes on how he wants it and the template are in the folder.
followup: null
timeout_s: 1200
traps:
- |-
  each Notes cell holds several dated entries separated by a new line, a blank line, ' | ' or ' ; ', and some entries wrap onto an indented second line with no date; splitting on new lines alone both merges and splits activities (checks: row count, 62 activities; activity date and type)
- |-
  entry dates are written 3/14, 03/14/26, Mar 14, March 14th, 14 Mar, 'the 14th of March' and 'Tue 3/10', sometimes after the initials; year-less November and December entries are 2025, so a parser that defaults to the current year puts them ten months in the future (check: activity date and type)
- |-
  bodies such as 'sent quote, install booked for 10/15' carry a second date that is not an activity; splitting on every date adds rows (checks: row count; activity date and type)
- |-
  initials are written JM, jm, J.M., (KT) or left off; left off means the account's Rep, and MB (Maria Bennett, deactivated) maps to Sofia Cruz, including notes on MB accounts with no initials (check: owner)
- |-
  Type comes from the keyword table (left vm is a Call, sent quote is an Email, stopped by is a Meeting) (check: activity date and type)
- |-
  three accounts have an empty Notes cell and get no activity (check: accounts with activities)
checks:
- type: csv_columns
  name: Pipedrive template columns, exact order
  path: activities.csv
  columns:
  - Account ID
  - Organization
  - Activity Date
  - Type
  - Owner Email
  - Note
  exact: true
- type: csv_set_equal
  name: accounts with activities
  path: activities.csv
  column: Account ID
  ref: activities.csv
- type: csv_row_count
  name: row count
  path: activities.csv
  equals_ref: activities.csv
