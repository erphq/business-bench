id: payments-match
track: desk
category: bookkeeping
title: Match bank payments to open invoices
ask: |
  Match the payments in this morning's bank export to our open invoices. Give me unpaid.csv with the invoices still open (invoice_id, customer, amount_outstanding) and matches.csv showing what got applied where (invoice_id, line_id, amount_applied).
followup: null
timeout_s: 1200
traps:
  - invoice references in bank descriptions are inconsistent ("INV-2026-0413", "INV 2026-0413", "inv2026-0413", "Payment 0413 Acme", "INV#20260413", bare "0413", "INVOICE 413"); payer names are bank-style uppercase and truncated
  - six payments carry only the customer name plus an exact invoice amount (match on customer + amount; those customers have several open invoices)
  - one ACH line pays two invoices and names both numbers; both must be applied from the same line
  - one wire names only the customer and equals the sum of two of that customer's three open invoices; the third invoice stays open
  - partial payment (60%) on INV-2026-0417; the remainder must appear in unpaid.csv (note.txt says partials stay open)
  - one credit is a supplier refund (REFUND ... ORD ...), not a customer payment; it must not be applied
  - one bank line is exported twice (identical row, same line_id); applying it twice over-pays the invoice
  - seven invoices have no payment at all; ~20 debits, a bank fee and an interest credit are noise
  - bank amounts carry thousands separators and dates are MM/DD/YYYY while invoice dates are ISO
checks:
  - type: csv_columns
    name: unpaid.csv columns
    path: unpaid.csv
    columns: [invoice_id, customer, amount_outstanding]
  - type: csv_set_equal
    name: unpaid invoice ids
    path: unpaid.csv
    column: invoice_id
    ref: unpaid.csv
  - type: csv_values_match
    name: amount outstanding per open invoice (partial remainder required)
    path: unpaid.csv
    ref: unpaid.csv
    key: invoice_id
    columns: [amount_outstanding]
    numeric: true
    tolerance: 0.01
    must_match_keys: [INV-2026-0417]
  - type: custom
    name: matches.csv applies payments correctly
    module: check.py
